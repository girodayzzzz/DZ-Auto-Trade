name = "dz-auto-trade-products"
main = "cloudflare-worker.js"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

# API routes for the static DZ Auto Trade site. The Pages project serves the
# website; this Worker serves only backend endpoints under /api/*.
routes = [
  { pattern = "dzautotrade.si/api/*", zone_name = "dzautotrade.si" },
  { pattern = "www.dzautotrade.si/api/*", zone_name = "dzautotrade.si" }
]

# Runtime values are configured in the Cloudflare dashboard. Preserve the KV,
# ordinary variables, and secrets when Wrangler uploads a new Worker version.
# This metadata must remain after top-level keys such as `routes`, because TOML
# keys following this table belong to `unsafe.metadata`.
[unsafe.metadata]
keep_bindings = ["kv_namespace", "plain_text", "secret_text"]
