name = "dz-auto-trade-products"
main = "cloudflare-worker.js"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]
# Never replace dashboard-managed variables or secrets during `wrangler deploy`.
# Secret values cannot be committed to this repository, so losing them would
# disable checkout until they are entered again in Cloudflare.
keep_vars = true

# API routes for the static DZ Auto Trade site. The Pages project serves the
# website; this Worker serves only backend endpoints under /api/*.
routes = [
  { pattern = "dzautotrade.si/api/*", zone_name = "dzautotrade.si" },
  { pattern = "www.dzautotrade.si/api/*", zone_name = "dzautotrade.si" }
]

# Keep invocation logs available in Workers & Pages > dz-auto-trade-products >
# Logs. Stripe response bodies and secret values are never logged by the Worker;
# request IDs and safe error codes remain available for checkout diagnosis.
[observability]
enabled = true
head_sampling_rate = 1

# Runtime values are configured in the Cloudflare dashboard. Preserve the KV
# binding as well when Wrangler uploads a new Worker version. `keep_vars` above
# is the supported Wrangler setting that preserves variables and secrets.
# This metadata must remain after top-level keys such as `routes`, because TOML
# keys following this table belong to `unsafe.metadata`.
[unsafe.metadata]
keep_bindings = ["kv_namespace", "plain_text", "secret_text"]

[[kv_namespaces]]
binding = "PRODUCTS_KV"
id = "f3b4234150054881b5d6eb22e9a73fed"

# Vehicle D1/R2 bindings are deliberately not hard-coded here: the resources
# have not yet been created in the production account. CI generates a temporary
# config with tools/configure_vehicle_bindings.py only after a real D1 id is
# supplied in the VEHICLES_D1_DATABASE_ID repository variable. Until then the
# deployed Worker returns 503 from vehicle endpoints instead of using KV or an
# unintended account resource.
