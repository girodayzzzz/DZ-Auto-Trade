plugins {
    id 'com.android.application'
}

android {
    namespace 'si.dzautotrade.app'
    compileSdk 35

    defaultConfig {
        applicationId 'si.dzautotrade.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        def signingVariables = [
            System.getenv('DZ_RELEASE_STORE_FILE'),
            System.getenv('DZ_RELEASE_STORE_PASSWORD'),
            System.getenv('DZ_RELEASE_KEY_ALIAS'),
            System.getenv('DZ_RELEASE_KEY_PASSWORD')
        ]
        if (signingVariables.every { it }) {
            release {
                storeFile file(System.getenv('DZ_RELEASE_STORE_FILE'))
                storePassword System.getenv('DZ_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('DZ_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('DZ_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.findByName('release')) signingConfig signingConfigs.release
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' } &&
        !android.signingConfigs.findByName('release')) {
        throw new GradleException('Release signing configuration is required; refusing to build an unsigned release.')
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
