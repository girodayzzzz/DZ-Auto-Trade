<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DZ Auto Trade logo">
  <defs>
    <clipPath id="icon-shape">
      <rect width="64" height="64" rx="12" />
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="12" fill="#000" />
  <!-- Crop the header logo tightly so its details remain legible at favicon sizes. -->
  <svg x="2" y="8" width="60" height="48" viewBox="70 410 1110 440" preserveAspectRatio="xMidYMid meet" clip-path="url(#icon-shape)">
