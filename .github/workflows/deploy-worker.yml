name: Test and deploy checkout Worker

on:
  push:
    branches: [main]
    paths:
      - cloudflare-worker.js
      - migrations/**
      - tools/configure_vehicle_bindings.py
      - vehicle-admin.js
      - vehicle-market.js
      - dz-app.html
      - avto-trznica.html
      - products.json
      - tools/sync_checkout_catalog.py
      - checkout.js
      - functions/checkout-api.js
      - tests/checkout_client_test.mjs
      - tests/checkout_worker.test.mjs
      - tests/checkout_security.test.mjs
      - tests/team_worker.test.mjs
      - tests/vehicle_helpers.test.mjs
      - tests/vehicle_inventory_test.py
      - STRIPE-CLOUDFLARE-SETUP.md
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

concurrency:
  group: deploy-checkout-worker
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test checkout Worker
        run: |
          python tools/sync_checkout_catalog.py
          node tests/checkout_client_test.mjs
          node tests/checkout_worker.test.mjs
          node tests/checkout_security.test.mjs
          node tests/team_worker.test.mjs
          node tests/vehicle_helpers.test.mjs
          python -m pytest -q
      - name: Select safe Worker configuration
        id: vehicle-config
        env:
          VEHICLES_D1_DATABASE_ID: ${{ vars.VEHICLES_D1_DATABASE_ID }}
        run: |
          if test -n "$VEHICLES_D1_DATABASE_ID"; then
            python tools/configure_vehicle_bindings.py --d1-id "$VEHICLES_D1_DATABASE_ID"
            echo 'config=wrangler.generated.toml' >> "$GITHUB_OUTPUT"
            echo 'vehicles_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::VEHICLES_D1_DATABASE_ID is not set; deploying without vehicle D1/R2 bindings. Vehicle endpoints will safely return 503.'
            echo 'config=wrangler.toml' >> "$GITHUB_OUTPUT"
            echo 'vehicles_ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply vehicle database migrations
        if: steps.vehicle-config.outputs.vehicles_ready == 'true'
        run: npx wrangler d1 migrations apply dz-auto-trade-vehicles --remote --config wrangler.generated.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy checkout Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars --config ${{ steps.vehicle-config.outputs.config }}
      - name: Verify production Worker routes and Stripe binding
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            "https://dzautotrade.si/api/checkout-health?verify=stripe" \
            "https://www.dzautotrade.si/api/checkout-health?verify=stripe"; do
            response="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$endpoint")"
            node -e '
              const health = JSON.parse(process.argv[1]);
              if (!health.checkoutReady || !health.stripeConnection?.ok) {
                console.error("Checkout is not ready after deploy:", health);
                process.exit(1);
              }
            ' "$response"
          done
