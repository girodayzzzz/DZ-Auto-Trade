name: Test checkout Worker

on:
  push:
    branches: [main]
    paths:
      - cloudflare-worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

concurrency:
  group: test-checkout-worker
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test checkout Worker
        run: node tests/checkout_worker.test.mjs
