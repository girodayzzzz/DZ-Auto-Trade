name: Test and deploy checkout Worker

on:
  push:
    branches: [main]
    paths:
      - cloudflare-worker.js
      - products.json
      - tools/sync_checkout_catalog.py
      - checkout.js
      - functions/checkout-api.js
      - tests/checkout_client_test.mjs
      - tests/checkout_worker.test.mjs
      - tests/checkout_security.test.mjs
      - STRIPE-CLOUDFLARE-SETUP.md
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

concurrency:
  group: deploy-checkout-worker
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test checkout Worker
        run: |
          python tools/sync_checkout_catalog.py
          node tests/checkout_client_test.mjs
          node tests/checkout_worker.test.mjs
          node tests/checkout_security.test.mjs
      - name: Deploy checkout Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars
      - name: Verify production Worker routes and Stripe binding
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            "https://dzautotrade.si/api/checkout-health?verify=stripe" \
            "https://www.dzautotrade.si/api/checkout-health?verify=stripe"; do
            response="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$endpoint")"
            node -e '
              const health = JSON.parse(process.argv[1]);
              if (!health.checkoutReady || !health.stripeConnection?.ok) {
                console.error("Checkout is not ready after deploy:", health);
                process.exit(1);
              }
            ' "$response"
          done
