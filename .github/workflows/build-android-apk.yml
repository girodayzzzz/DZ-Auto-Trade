name: Build Android APK

on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/scripts/verify-android-release.sh'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Unique release tag (for example android-v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  debug-check:
    if: github.event_name == 'pull_request'
    name: Build and verify debug APK (not for distribution)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify debug APK structure and package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='si.dzautotrade.app'"
      - name: Upload debug test artifact
        uses: actions/upload-artifact@v4
        with:
          name: dz-auto-trade-debug-test-only
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch'
    name: Build, verify and publish signed release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      APK_NAME: DZ-Auto-Trade.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Require every signing secret
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            test -n "${!name}" || { echo "Required Android signing secret is missing: $name" >&2; exit 1; }
          done
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'Invalid release tag.' >&2; exit 1; }
          ! gh release view "$RELEASE_TAG" >/dev/null 2>&1 || { echo 'Release tag already exists; use a new tag.' >&2; exit 1; }

      - name: Decode temporary keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set +x
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dz-release.keystore"
          test -s "$RUNNER_TEMP/dz-release.keystore"

      - name: Build signed release APK
        working-directory: android-app
        env:
          DZ_RELEASE_STORE_FILE: ${{ runner.temp }}/dz-release.keystore
          DZ_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DZ_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DZ_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify package, version, signature and file
        id: verify
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          .github/scripts/verify-android-release.sh "$APK" "$AAPT" "$APKSIGNER" "$EXPECTED_CERT_SHA256"
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          VERSION_CODE="$($AAPT dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Require versionCode newer than latest published APK
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          NEW_VERSION_CODE: ${{ steps.verify.outputs.version_code }}
        run: |
          if LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null)"; then
            mkdir "$RUNNER_TEMP/previous"
            gh release download "$LATEST_TAG" --pattern "$APK_NAME" --dir "$RUNNER_TEMP/previous"
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
            OLD_APK="$RUNNER_TEMP/previous/$APK_NAME"
            .github/scripts/verify-android-release.sh "$OLD_APK" "$AAPT" "$APKSIGNER" "$EXPECTED_CERT_SHA256"
            OLD_VERSION_CODE="$($AAPT dump badging "$OLD_APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
            test "$NEW_VERSION_CODE" -gt "$OLD_VERSION_CODE" || {
              echo "versionCode must increase (latest: $OLD_VERSION_CODE, candidate: $NEW_VERSION_CODE)." >&2
              exit 1
            }
          else
            echo 'No published release exists; treating this as the first signed release.'
          fi

      - name: Publish non-draft, non-prerelease GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME" \
            --title "DZ Auto Trade Android $RELEASE_TAG" \
            --notes "Production Android release. Package: si.dzautotrade.app; versionCode: ${{ steps.verify.outputs.version_code }}." \
            --latest --verify-tag=false

      - name: Verify anonymous permanent download
        run: |
          URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$APK_NAME"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error --output "$RUNNER_TEMP/anonymous.apk" "$URL"; then break; fi
            test "$attempt" -lt 5 || exit 1
            sleep 5
          done
          cmp "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/anonymous.apk"
          file "$RUNNER_TEMP/anonymous.apk" | grep -Eq 'Android package|Zip archive'
          unzip -t "$RUNNER_TEMP/anonymous.apk"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dz-release.keystore"
